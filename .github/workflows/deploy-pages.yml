name: Deploy landing page

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

concurrency:
  group: deploy-pages
  cancel-in-progress: true

# Least privilege: the deploy only reads the repo; the Cloudflare token (a repo
# secret) carries the deploy permission, not the workflow's GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  deploy:
    name: Deploy site to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Deploys the static site/ directory to the "skyquery-mcp" Pages project,
      # which serves the production URL https://skyquery-mcp.pages.dev.
      # Requires two repo secrets: CLOUDFLARE_API_TOKEN (with Cloudflare Pages:Edit)
      # and CLOUDFLARE_ACCOUNT_ID. The token is verified against the Cloudflare API
      # first: if it is missing or invalid the deploy is skipped and the workflow
      # stays green (with a warning) rather than failing red. See SETUP.md.
      - name: Verify Cloudflare credentials
        id: creds
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare secrets not set; skipping deploy. See SETUP.md."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $CF_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)
          if [ "$code" = "200" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN is set but not valid (token verify returned HTTP $code); skipping deploy. Recreate it with the Cloudflare Pages:Edit permission and update the secret."
          fi

      - name: Publish to Cloudflare Pages
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=skyquery-mcp --branch=main
